name: Weekly Deploy

# Safety-net release path. The previous caretta-action reference could not be
# resolved (action missing/private), which failed every Monday schedule.
# Dependency shipping is owned by Auto Tag on lockfile pushes; this job only
# covers the case where a lockfile landed on main without a newer tag.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Fail early if RELEASE_TOKEN is missing
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. Weekly Deploy cannot push tags."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Ship pending lockfile bumps
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No tags found; nothing to compare."
            exit 0
          fi

          if ! git diff --name-only "$LAST_TAG"..HEAD | grep -qE '^(bun\.lock|package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$'; then
            echo "No lockfile changes since $LAST_TAG; nothing to ship."
            exit 0
          fi

          echo "Lockfile changed since $LAST_TAG; cutting a patch release."

          CURRENT=$(node -p "require('./package.json').version")
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=${PATCH%%-*}
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"

          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::tag v$NEXT already exists"
            exit 1
          fi

          npm version "$NEXT" --no-git-tag-version --allow-same-version
          npx --yes @biomejs/biome format --write package.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json
          git commit -m "chore(release): v$NEXT"
          git tag -a "v$NEXT" -m "Release v$NEXT"
          git push origin HEAD:main
          git push origin "v$NEXT"

          echo "Tagged v$NEXT"
