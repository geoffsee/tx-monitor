version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    assignees:
      - "geoffsee"
    groups:
      bun-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      bun-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # mobx-state-tree still peers on mobx@^6; MobX 7 breaks map construction
    # (ObservableMap requires `new`) until MST ships a compatible release.
    ignore:
      - dependency-name: "mobx"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    assignees:
      - "geoffsee"
    groups:
      github-actions:
        patterns:
          - "*"
    # Private / unreachable action repos cause Dependabot update jobs to fail
    # red even when public action bumps succeed.
    ignore:
      - dependency-name: "geoffsee/caretta-action"
      - dependency-name: "geoffsee/caretta-autopilot-action"
      - dependency-name: "geoffsee/helios-action"
    commit-message:
      prefix: "ci"
      include: "scope"
