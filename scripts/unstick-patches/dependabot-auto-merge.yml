name: Dependabot auto-merge

# pull_request_target runs in the base-branch context so repository secrets
# (RELEASE_TOKEN) are available. Dependabot pull_request events cannot read
# those secrets, and merges performed with GITHUB_TOKEN do not trigger
# downstream push workflows (Auto Tag / Test on main).
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fail early if RELEASE_TOKEN is missing
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. Auto-merge with GITHUB_TOKEN" \
                 "does not trigger push workflows (Auto Tag / CI on main)."
            exit 1
          fi

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for non-major updates
        if: >
          steps.metadata.outputs.dependency-group != 'bun-major' &&
          steps.metadata.outputs.dependency-group != 'cargo-major' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
